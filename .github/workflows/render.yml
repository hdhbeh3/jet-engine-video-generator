name: Render Jet Engine Remotion Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -oq "jet-engine-remotion (1).zip" -d project

          PROJECT_DIR="$(dirname "$(find project -name package.json -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/src/index.ts" ]; then
            echo "ERROR: Remotion project structure not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Install project dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Prepare voiceover and generate audio
        run: |
          test -f assets/voiceover.m4a

          cp assets/voiceover.m4a "$PROJECT_DIR/src/voiceover.m4a"

          python -m pip install --upgrade pip
          python -m pip install numpy scipy

          cd "$PROJECT_DIR"
          python3 src/build_audio.py

          test -f public/audio/final-mix.m4a

      - name: Render 3D video
        run: |
          mkdir -p output
          cd "$PROJECT_DIR"

          npx remotion render \
            src/index.ts \
            JetEngine \
            "$GITHUB_WORKSPACE/output/jet-engine.mp4" \
            --codec h264

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: jet-engine-final-video
          path: output/jet-engine.mp4
          if-no-files-found: error
          
