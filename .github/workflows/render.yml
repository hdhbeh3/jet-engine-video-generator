name: Render Jet Engine Remotion Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -oq "jet-engine-remotion (1).zip" -d project

          PACKAGE_FILE="$(find project -name package.json -print -quit)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f

      - name: Install project dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Prepare voiceover and generate audio
        run: |
          test -f assets/voiceover.m4a

          AUDIO_SCRIPT="$(find "$PROJECT_DIR" -name build_audio.py -print -quit)"

          if [ -z "$AUDIO_SCRIPT" ]; then
            echo "ERROR: build_audio.py not found"
            exit 1
          fi

          SCRIPT_DIR="$(dirname "$AUDIO_SCRIPT")"

          echo "Audio script: $AUDIO_SCRIPT"

          cp assets/voiceover.m4a "$SCRIPT_DIR/voiceover.m4a"

          python -m pip install --upgrade pip
          python -m pip install numpy scipy

          python3 "$AUDIO_SCRIPT"

          mkdir -p "$PROJECT_DIR/public/audio"

          MIX_PATH="$SCRIPT_DIR/../public/audio/final-mix.m4a"
          DEST="$PROJECT_DIR/public/audio/final-mix.m4a"

          if [ ! -f "$MIX_PATH" ]; then
            echo "ERROR: Generated audio file not found"
            find "$PROJECT_DIR" -name "final-mix.m4a"
            exit 1
          fi

          if [ "$(realpath -m "$MIX_PATH")" != "$(realpath -m "$DEST")" ]; then
            cp "$MIX_PATH" "$DEST"
          fi

          test -f "$DEST"
          echo "Final audio ready"

      - name: Render 3D video
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd "$PROJECT_DIR"

          npx remotion render \
            src/index.ts \
            JetEngine \
            "$GITHUB_WORKSPACE/output/jet-engine.mp4" \
            --codec h264

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: jet-engine-final-video
          path: output/jet-engine.mp4
          if-no-files-found: error
          
